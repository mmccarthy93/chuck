<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.H.U.C.K.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>C.H.U.C.K.</h1>
            <p>Cognitive Heuristic Utility & Command Kernel</p>
            <span class="status">● Interface Ready</span>
        </header>

        <main id="chat-messages"></main>

        <form id="chat-form">
            <input
                type="text"
                id="message-input"
                placeholder="Ask CHUCK something..."
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
